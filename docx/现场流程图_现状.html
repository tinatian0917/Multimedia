<text class="ts" x="40" y="64" fill="#5F5E5A">五段业务链路，每段交接记录接收人、版本与未结项 [f01][f20][f23]</text>

<text class="th" x="60" y="188" fill="#791F1F">现场痛点</text>
<text class="ts" x="60" y="212" fill="#791F1F">1. 渠道规格与审批版本混放，需逐个打开确认对应关系 [f10]</text>
<text class="ts" x="60" y="234" fill="#791F1F">2. 三类工具无统一关联编号，追溯靠人工比对 [f30]</text>
<text class="ts" x="60" y="256" fill="#791F1F">3. 封面改版后清单仍指向旧链接，责任需翻原始版本判断 [f11]</text>
<text class="ts" x="60" y="278" fill="#791F1F">4. 先群消息后补表致回填时间失真 [f13]；核对 8 小时 / 90 份 [f12]</text>
